server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed assets. Cache those, not the shell document.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client routes (/login, /demo, /app, /auth/callback) are history API paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
